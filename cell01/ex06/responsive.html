<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tab</title>
    <style>
        table{
            width: 100%;
            height: 180px;
            border-collapse: collapse;
         }

        td{
             border: 1px solid black;
        }
        
         #box1{
            background-color: lightgreen;
        }

        #box2{
            background-color: lightpink;
        }
    </style>

</head>

<body>

    <table>
        <tr>
            <td id="box1">First cell</td>
            <td id="box2">Second cell</td>
        </tr>
    </table>

</body>
</html>
