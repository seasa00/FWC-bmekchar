<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basics</title>
    <style>
        body{
            background-color: pink;
        }
        h1{
            color: white;
            text-align: center;
        }
        h3{
            text-align: right;
            font-style: italic;
            font-family: monospace;
        }
        #shopee{
            width: 350pt;
            height: 225pt;
        }
        #amazon{
            width: 350pt;
            height: 225pt;
        }
        .shops{
            display: flex;
            gap: 50px;
            justify-content: center;
        }   

        .shop{
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <h1>My shop♥</h1>
    <div class="shops">
    <div class="shop">
        <img id="shopee" src="https://mb.com.ph/manilabulletin/uploads/images/2025/06/25/21863.webp" alt="shopee">
        <a href="https://shopee.co.th/">link to shopee</a>
    </div>

    <div class="shop">
        <img id="amazon" src="https://www.ote.co/up_img/1654071680021d6b60fe25be73f504c5ab2377ba51.jpg" alt="amazon">
        <a href="https://www.amazon.com/">link to amazon</a>
    </div>
    </div>
    
    <hr>
    <h3>© will 2026</h3>

</body>
</html>
